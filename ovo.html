<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OVO Call Center</title>
    <!-- Mengimpor Font Awesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Reset dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        /* Bagian Header Ungu */
        .header {
            background-color: #4a2b8c;
            color: #ffffff;
            padding: 20px;
            position: relative;
            height: 280px;
            background-image: linear-gradient(135deg, rgba(255,255,255,0.05) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.05) 75%, transparent 75%, transparent);
            background-size: 100px 100px;
        }

        .top-nav {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
        }

        .hamburger {
            color: #00d2d3;
            font-size: 24px;
            margin-right: 15px;
            cursor: pointer;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            -webkit-text-stroke: 1px #ffffff;
            color: transparent;
        }

        .header-text h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .header-text h2 {
            font-size: 28px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .content {
            padding: 30px 20px;
            background-color: #ffffff;
        }

        .content h3 {
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .content p {
            font-size: 15px;
            color: #333333;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .contact-section {
            margin-top: 20px;
        }

        .contact-label {
            font-size: 16px;
            color: #888888;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 18px;
            color: #4a2b8c;
            font-weight: 500;
            text-decoration: none;
        }

        .contact-item i {
            width: 30px;
            font-size: 22px;
            margin-right: 15px;
            color: #4a2b8c;
            text-align: center;
        }

        .contact-item:hover {
            opacity: 0.8;
        }

        /* GAYA UNTUK BUTTON LOGIN */
        .login-btn-container {
            margin-top: 40px;
            text-align: center;
        }

        .login-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #4a2b8c;
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px rgba(74, 43, 140, 0.2);
        }

        .login-btn:hover {
            background-color: #3b1f73;
        }

        .login-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- Header Ungu -->
        <div class="header">
            <div class="top-nav">
                <div class="hamburger">
                    <i class="fa-solid fa-bars"></i>
                </div>
                <div class="logo">OVO</div>
            </div>
            <div class="header-text">
                <h1>Contact Us</h1>
                <h2>OVO Call Center</h2>
            </div>
        </div>

        <!-- Konten Putih -->
        <div class="content">
            <h3>Hubungi Kami</h3>
            <p>Tidak menemukan jawaban dari kendalamu? Yuk, hubungi kami melalui call center, email atau kirim laporan.</p>

            <div class="contact-section">
                <div class="contact-label">OVO User</div>
                
                <a href="tel:1500696" class="contact-item">
                    <i class="fa-solid fa-mobile-screen"></i>
                    <span>1 500 696</span>
                </a>

                <a href="mailto:cs@ovo.id" class="contact-item">
                    <i class="fa-solid fa-envelope"></i>
                    <span>cs@ovo.id</span>
                </a>
            </div>

            <!-- Button Login -->
            <div class="login-btn-container">
                <button class="login-btn" onclick="redirectToLogin()">Login ke Akun OVO</button>
            </div>
            
        </div>
    </div>

    <!-- JavaScript untuk Redirect -->
    <script>
        function redirectToLogin() {
            // Mengarahkan pengguna ke URL tujuan setelah tombol diklik
            window.location.href = "https://rough-coral-efz36y0i.edgeone.dev/";
        }
    </script>

</body>
</html>
